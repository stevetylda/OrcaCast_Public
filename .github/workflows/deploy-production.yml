name: deploy-production

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    name: staging-and-production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: orcacast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sha256sum --check artifact-sha256.txt
      - name: Detect configured deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deployment is staged but disabled until the production environment has Cloudflare credentials."
          fi
      - name: Install Chromium
        if: steps.credentials.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: Deploy immutable staging preview
        if: steps.credentials.outputs.configured == 'true'
        id: staging
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=orcacast --branch=staging-${{ github.event.workflow_run.head_sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Test deployed staging artifact
        if: steps.credentials.outputs.configured == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.staging.outputs.deployment-url }}
        run: npm run test:e2e:chromium
      - name: Record rollback target
        if: steps.credentials.outputs.configured == 'true'
        id: previous
        run: node scripts/cloudflare-pages.mjs current
      - name: Reverify immutable artifact
        if: steps.credentials.outputs.configured == 'true'
        run: sha256sum --check artifact-sha256.txt
      - name: Deploy the tested artifact to production
        if: steps.credentials.outputs.configured == 'true'
        id: production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=orcacast --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Production smoke tests
        if: steps.credentials.outputs.configured == 'true'
        id: production-smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL || steps.production.outputs.deployment-url }}
        run: npm run test:e2e:chromium -- --grep "loads directly|favicons"
      - name: Roll back failed production deployment
        if: steps.production-smoke.outcome == 'failure' && steps.previous.outputs.deployment_id != ''
        run: node scripts/cloudflare-pages.mjs rollback "${{ steps.previous.outputs.deployment_id }}"
      - name: Verify rollback health
        if: steps.production-smoke.outcome == 'failure' && steps.previous.outputs.deployment_id != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --retry 5 --retry-delay 5 "${PRODUCTION_URL:-https://orcacast-public.pages.dev}/"
      - name: Fail after rollback
        if: steps.production-smoke.outcome == 'failure'
        run: |
          echo "::error::Production smoke tests failed. The previous successful deployment was restored when available."
          exit 1
      - name: Upload deployment browser diagnostics
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-browser-${{ github.event.workflow_run.head_sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
